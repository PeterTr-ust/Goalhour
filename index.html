<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goalhour" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Goalhour</title>
    <script>
      // Apply the saved theme before the first paint to avoid a light/dark flash.
      // Keep the storage key in sync with THEME_STORAGE_KEY in src/lib/theme.ts.
      (function () {
        var preference = null;
        try {
          preference = localStorage.getItem('goalhour.theme');
        } catch (error) {
          preference = null;
        }
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = preference === 'dark' || (preference !== 'light' && systemDark);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
